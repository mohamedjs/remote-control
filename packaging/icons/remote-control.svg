<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="pad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#334155" stroke-width="2" opacity="0.6"/>

  <!-- Phone / remote frame -->
  <rect x="136" y="56" width="240" height="400" rx="42" fill="url(#pad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.7"/>

  <!-- Speaker notch -->
  <rect x="226" y="78" width="60" height="6" rx="3" fill="#64748b"/>

  <!-- Trackpad area -->
  <rect x="160" y="106" width="192" height="210" rx="16" fill="#0b1329" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle touch gesture arcs on trackpad -->
  <circle cx="256" cy="210" r="44" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 6" opacity="0.5"/>
  <circle cx="256" cy="210" r="14" fill="url(#accent)" filter="url(#glow)"/>

  <!-- Lower buttons (Decks / Play / Volume) -->
  <g transform="translate(160, 332)">
    <!-- Button 1 -->
    <rect x="0" y="0" width="56" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M22 16 L38 22 L22 28 Z" fill="#38bdf8"/>
    <!-- Button 2 (Middle) -->
    <rect x="68" y="0" width="56" height="44" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="88" y="16" width="4" height="12" rx="1" fill="#38bdf8"/>
    <rect x="96" y="16" width="4" height="12" rx="1" fill="#38bdf8"/>
    <!-- Button 3 -->
    <rect x="136" y="0" width="56" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <path d="M158 20 L166 14 L166 30 L158 24 Z M169 16 A 8 8 0 0 1 169 28" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Antenna / WiFi Waves from device -->
  <path d="M 230 42 A 32 32 0 0 1 282 42" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M 216 28 A 48 48 0 0 1 296 28" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
</svg>
